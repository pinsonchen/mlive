title: "[Idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议或改进想法！请描述你的需求场景。
        Feature suggestions and improvement ideas are welcome! Please describe your use case.

  - type: textarea
    id: problem
    attributes:
      label: 需求背景 / Problem or Use Case
      description: 描述你希望解决的问题或使用场景
      placeholder: |
        在 ... 场景下，我需要 ...
        In ... scenario, I need ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 你设想的解决方式（可选）
      placeholder: |
        可以通过 ... 来实现
        This could be achieved by ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives Considered
      description: 你考虑过的其他方案
      placeholder: |
        也可以 ...
        Alternatively, ...
    validations:
      required: false
