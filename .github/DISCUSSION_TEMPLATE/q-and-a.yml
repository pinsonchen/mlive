title: "[Q&A] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提问！请尽量提供详细信息，以便社区更快地帮助你。
        Thank you for asking! Please provide as much detail as possible so the community can help you quickly.

  - type: dropdown
    id: platform
    attributes:
      label: 相关平台 / Platform
      description: 你的问题涉及哪个平台？
      multiple: true
      options:
        - 淘宝直播
        - 视频号直播
        - 小红书直播
        - 抖音直播
        - 全部平台
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 清晰描述你遇到的问题或想了解的内容
      placeholder: |
        描述你的问题...
        Describe your question...
    validations:
      required: true

  - type: textarea
    id: steps_tried
    attributes:
      label: 已尝试的方法 / Steps Already Tried
      description: 你已经尝试了哪些方法来解决这个问题？
      placeholder: |
        1. 查阅了文档中的 ...
        2. 尝试了 ...
        3. 结果是 ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 环境信息 / Environment
      description: 操作系统、OBS/ffmpeg 版本等相关环境信息
      placeholder: "例：macOS 14.5 / OBS 30.2 / ffmpeg 6.1"
    validations:
      required: false
