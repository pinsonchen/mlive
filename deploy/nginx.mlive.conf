# nginx configuration snippet for mlive guide
# Include this in your server block: include /etc/nginx/conf.d/mlive.conf;

# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/html
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;

# Brotli static - serve pre-compressed .br files if available
brotli_static on;

# Serve pre-compressed gzip files if available
gzip_static on;

location /mlive/ {
    alias /var/www/tools.pinsonbot.com/mlive/;

    # HTML - no-cache to always validate freshness
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    # CSS and JS - immutable long-term cache (content-hashed in future)
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # Compressed variants - try .br first, then .gz, then original
    location ~* \.(css|js|html)$ {
        add_header Vary "Accept-Encoding";
    }
}
