<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线模式 - 多平台同步开播操作指南</title>
    <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#1f2937}
    .offline-card{background:#ffffff;border-radius:20px;padding:60px 40px;text-align:center;max-width:500px;width:100%;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1)}
    .offline-icon{font-size:4rem;margin-bottom:20px}
    h1{font-size:1.8rem;color:#4f46e5;margin-bottom:12px}
    p{font-size:1.1rem;color:#6b7280;margin-bottom:24px;line-height:1.6}
    .retry-btn{display:inline-block;padding:12px 32px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s ease;text-decoration:none}
    .retry-btn:hover{background:#4f46e5;transform:translateY(-2px);box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
    .hint{margin-top:20px;font-size:.9rem;color:#9ca3af}
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">📡</div>
        <h1>当前处于离线状态</h1>
        <p>无法连接到网络。已缓存的指南内容仍可正常使用，请返回首页查看。</p>
        <a href="/" class="retry-btn" onclick="window.location.reload();return false;">重新连接</a>
        <p class="hint">连接恢复后页面将自动更新</p>
    </div>
</body>
</html>
